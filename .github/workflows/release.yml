# Pushing a version tag (e.g. v1.1.9-fork) builds every target and publishes a GitHub release
# with all jars attached. GitHub adds the source code (zip / tar.gz) to the release automatically.
#
# Ein Versions-Tag (z. B. v1.1.9-fork) baut alle Versionen und veröffentlicht ein GitHub-Release
# mit allen JAR-Dateien. Den Quellcode (zip / tar.gz) hängt GitHub automatisch an.
# (Adapted from OpSec Community Edition by tufkan1, GPL-3.0; Modrinth/CurseForge publishing removed.)
name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build all targets
        run: |
          chmod +x gradlew
          ./gradlew buildAll --no-daemon --stacktrace

      - name: Collect release jars
        run: |
          mkdir -p release_artifacts
          find versions -path "*/build/libs/opsec-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} release_artifacts/ \;
          ls -la release_artifacts/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_artifacts/*
          body_path: .github/RELEASE_NOTES.md
          draft: false
          prerelease: false
