# Builds every Minecraft target on each push / pull request, so a broken change is noticed at once.
# Baut bei jedem Push / Pull Request alle Minecraft-Versionen, damit Fehler sofort auffallen.
# (Adapted from OpSec Community Edition by tufkan1, GPL-3.0.)
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build all targets
        run: |
          chmod +x gradlew
          ./gradlew buildAll --no-daemon --stacktrace

      - name: Upload jars (download from the run page / Download auf der Run-Seite)
        uses: actions/upload-artifact@v4
        with:
          name: opsec-jars
          path: |
            versions/*/build/libs/opsec-*.jar
            !versions/*/build/libs/*-sources.jar
          retention-days: 14
